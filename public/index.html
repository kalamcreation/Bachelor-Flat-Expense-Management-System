<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ব্যাচেলর ফ্ল্যাট এক্সপেন্স ম্যানেজমেন্ট সিস্টেম</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io Client Script -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: #fff !important;
            }
            table {
                width: 100% !important;
                border-collapse: collapse;
            }
        }
    </style>  

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2563eb",
              success: "#16a34a",
              danger: "#dc2626",
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-100">
    <div class="max-w-7xl mx-auto p-6">
      <!-- Header -->
      <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <h1 class="text-3xl font-bold text-center text-primary">
          🏠 ব্যাচেলর ফ্ল্যাট এক্সপেন্স ম্যানেজমেন্ট সিস্টেম
        </h1>
        <p class="text-center text-gray-500 mt-2 font-bold">
          Bachelor Flat Expense Management System
        </p>
      </div>

      <!-- Top Section -->
      <div class="flex flex-col lg:flex-row justify-between items-start gap-6 mb-6">
          <div class="flex-1 w-full">
              <!-- Buttons -->
              <div class="flex flex-wrap gap-3 mb-4 no-print">
                  <button id="addRow"
                      class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-semibold transition">
                      ➕ নতুন সদস্য
                  </button>

                  <button id="printBtn"
                      class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg font-semibold transition">
                      🖨 Print
                  </button>

                  <button id="clearBtn"
                      class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg font-semibold transition">
                      🗑 Clear All
                  </button>
              </div>

              <!-- Monthly Summary -->
              <div class="bg-white rounded-xl shadow-md border p-4">
                  <h2 class="text-xl font-bold text-blue-700 mb-4">
                      📊 মাসিক হিসাব ও রেট নির্ধারণ
                  </h2>

                  <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
                      <!-- টোটাল বাজার -->
                      <div>
                          <label class="block font-semibold mb-1 text-sm text-gray-700">
                              টোটাল বাজার
                          </label>
                          <input type="number"
                              id="totalMarket"
                              placeholder="0"
                              class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                      </div>

                      <!-- টোটাল মিল -->
                      <div>
                          <label class="block font-semibold mb-1 text-sm text-gray-700">
                              টোটাল মিল
                          </label>
                          <input type="number"
                              id="totalMeal"
                              placeholder="0"
                              class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                      </div>

                      <!-- মিল রেট -->
                      <div>
                          <label class="block font-semibold mb-1 text-sm text-gray-700">
                              মিল রেট
                          </label>
                          <input type="text"
                              id="mealRate"
                              readonly
                              class="w-full bg-gray-100 border rounded-lg px-3 py-2 font-bold text-blue-600">
                      </div>

                      <!-- মোট সংস্থাপন -->
                      <div>
                          <label class="block font-semibold mb-1 text-sm text-gray-700">
                              মোট সংস্থাপন
                          </label>
                          <input type="number"
                              id="totalSetup"
                              placeholder="0"
                              class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                      </div>

                      <!-- মোট সদস্য -->
                      <div>
                          <label class="block font-semibold mb-1 text-sm text-gray-700">
                              মোট সদস্য
                          </label>
                          <input type="number"
                              id="totalMembersInput"
                              placeholder="0"
                              value="0"
                              class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                      </div>

                      <!-- প্রতি জন সংস্থাপন -->
                      <div>
                          <label class="block font-semibold mb-1 text-sm text-gray-700">
                              সংস্থাপন (প্রতি জন)
                          </label>
                          <input type="text"
                              id="setupPerPerson"
                              readonly
                              class="w-full bg-gray-100 border rounded-lg px-3 py-2 font-bold text-green-600">
                      </div>
                  </div>
              </div>
          </div>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto bg-white rounded-xl shadow">
        <table class="w-full border border-gray-300 text-center">
          <thead class="bg-blue-600 text-white">
            <tr>
              <th class="border p-3">নাম</th>
              <th class="border p-3">মিল সংখ্যা</th>
              <th class="border p-3">মিল খরচ</th>
              <th class="border p-3">বাসা ভাড়া</th>
              <th class="border p-3">সংস্থাপন</th>
              <th class="border p-3">বাজার জমা</th>
              <th class="border p-3">অন্যান্য জমা</th>
              <th class="border p-3 bg-yellow-400 text-black">মোট খরচ</th>
              <th class="border p-3 bg-green-400 text-black">মোট জমা</th>
              <th class="border p-3 bg-purple-400 text-black">পাবে / দিবে</th>
              <th class="border p-3 no-print">Action</th>
            </tr>
          </thead>

          <tbody id="tableBody">
            <!-- Dynamic Rows will be inserted here -->
          </tbody>

          <tfoot class="bg-gray-200 font-bold">
            <tr>
              <td colspan="7" class="border p-3 text-right">Grand Total</td>
              <td id="grandExpense" class="border p-3">0</td>
              <td id="grandDeposit" class="border p-3">0</td>
              <td id="grandBalance" class="border p-3 text-blue-700">0</td>
              <td class="border no-print"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="text-center py-6">
      <h4 class="text-gray-600 font-medium">Create with 💕 by K@lam</h4>
    </div>

    <script src="script.js"></script>
  </body>
</html>
