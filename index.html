<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>বাসা খরচ ম্যানেজমেন্ট</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2563eb",
              success: "#16a34a",
              danger: "#dc2626",
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-100">
    <div class="max-w-7xl mx-auto p-6">
      <!-- Header -->

      <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <h1 class="text-3xl font-bold text-center text-primary">
          🏠 ব্যাচেলর ফ্ল্যাট এক্সপেন্স ম্যানেজমেন্ট সিস্টেম
        </h1>

        <p class="text-center text-gray-500 mt-2 font-bold">
          Bachelor Flat Expense Management System
        </p>
      </div>

      <!-- Buttons -->

      <div class="flex flex-wrap gap-3 mb-5">
        <button
          id="addRow"
          class="bg-primary hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-semibold"
        >
          ➕ নতুন সদস্য
        </button>

        <button
          id="printBtn"
          class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg font-semibold"
        >
          🖨 Print
        </button>

        <button
          id="clearBtn"
          class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg font-semibold"
        >
          🗑 Clear
        </button>
      </div>

      <!-- Table -->

      <div class="overflow-x-auto bg-white rounded-xl shadow">
        <table class="w-full border border-gray-300 text-center">
          <thead class="bg-blue-600 text-white">
            <tr>
              <th class="border p-3">নাম</th>

              <th class="border p-3">মিল খরচ</th>

              <th class="border p-3">বাসা ভাড়া</th>

              <th class="border p-3">সংস্থাপন</th>

              <th class="border p-3">বাজার</th>

              <th class="border p-3">অন্যান্য</th>

              <th class="border p-3 bg-yellow-400 text-black">মোট খরচ</th>

              <th class="border p-3 bg-green-400 text-black">মোট জমা</th>

              <th class="border p-3 bg-purple-400 text-black">পাবে / দিবে</th>

              <th class="border p-3">Action</th>
            </tr>
          </thead>

          <tbody id="tableBody">
            <!-- Row 1 -->

            <tr class="border">
              <td class="border p-2">
                <input
                  type="text"
                  placeholder="নাম"
                  class="name w-32 border rounded px-2 py-1"
                />
              </td>

              <td class="border p-2">
                <input
                  type="number"
                  min="0"
                  class="meal amount w-24 border rounded px-2 py-1"
                />
              </td>

              <td class="border p-2">
                <input
                  type="number"
                  min="0"
                  class="rent amount w-24 border rounded px-2 py-1"
                />
              </td>

              <td class="border p-2">
                <input
                  type="number"
                  min="0"
                  class="setup amount w-24 border rounded px-2 py-1"
                />
              </td>

              <td class="border p-2">
                <input
                  type="number"
                  min="0"
                  class="market amount w-24 border rounded px-2 py-1"
                />
              </td>

              <td class="border p-2">
                <input
                  type="number"
                  min="0"
                  class="others amount w-24 border rounded px-2 py-1"
                />
              </td>

              <td class="border p-2 font-bold totalExpense">0</td>

              <td class="border p-2 font-bold totalDeposit">0</td>

              <td class="border p-2 font-bold balance text-blue-600">0</td>

              <td class="border p-2">
                <button
                  class="deleteRow bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded"
                >
                  Delete
                </button>
              </td>
            </tr>
          </tbody>

          <tfoot class="bg-gray-200 font-bold">
            <tr>
              <td colspan="6" class="border p-3 text-right">Grand Total</td>

              <td id="grandExpense" class="border p-3">0</td>

              <td id="grandDeposit" class="border p-3">0</td>

              <td id="grandBalance" class="border p-3 text-blue-700">0</td>

              <td class="border"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
